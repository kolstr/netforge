server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    # Vite emits content-hashed assets, so they can be cached indefinitely.
    # Security headers are repeated because add_header does not inherit into
    # a location block that defines its own headers.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Single-page app: unknown paths fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}
