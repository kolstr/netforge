services:
  netforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: netforge-studio:latest
    container_name: netforge-studio
    ports:
      - "5173:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
